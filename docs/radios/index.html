<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Radios</title>
<style>:root{color-scheme:dark;--card:#122238;--card2:#172c47;--text:#f3f7ff;--muted:#9fb1c9;--line:#294461;--green:#54d7aa;--red:#ff7180}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:linear-gradient(135deg,#07111f,#102b48);color:var(--text);min-height:100vh;padding-top:14px}
.toolbar{max-width:1400px;margin:0 auto 10px;padding:0 20px}
#S{width:100%;border:1px solid var(--line);border-radius:10px;background:#0e1d30;color:var(--text);padding:11px 14px;font:inherit}
.grid{max-width:1400px;margin:auto;padding:0 20px 100px;display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.card{border:1px solid var(--line);border-radius:14px;background:linear-gradient(150deg,var(--card),var(--card2));padding:14px;box-shadow:0 8px 24px #0003}
.card-inner{display:flex;gap:12px;align-items:center}
.logo,.logo-fb{width:58px;height:58px;border-radius:10px;flex-shrink:0}
.logo{background:#fff;object-fit:contain;display:block}
.logo-fb{background:#203b59;display:grid;place-items:center;font-size:26px}
.info{min-width:0;flex:1;overflow:hidden}
.info h2{font-size:.96rem;margin:0 0 3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.loc{color:var(--muted);font-size:.79rem;margin-bottom:7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badges{display:flex;flex-wrap:wrap;gap:4px}
.badge{background:#203c5d;color:#d7e9ff;border-radius:999px;padding:3px 8px;font-size:.71rem}
.actions{margin-top:11px}
.play{width:100%;border:0;border-radius:8px;background:var(--green);color:#06271d;padding:10px;font-weight:750;cursor:pointer;font-size:.88rem}
.play.stop{background:var(--red);color:#33060b}
.play:disabled{opacity:.45;cursor:not-allowed}
.player{display:none;position:fixed;z-index:10;left:50%;bottom:12px;transform:translateX(-50%);width:min(820px,calc(100% - 20px));padding:11px 14px;border:1px solid var(--line);border-radius:13px;background:#07111ff5;box-shadow:0 10px 36px #0009;gap:12px;align-items:center}
.player.show{display:flex}
.player strong{min-width:140px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:.9rem}
.player audio{width:100%}
.message{grid-column:1/-1;text-align:center;padding:50px 20px;color:var(--muted)}
.toast{display:none;position:fixed;z-index:20;right:16px;top:16px;padding:11px 14px;border:1px solid #34769d;border-radius:10px;background:#123452;font-size:.88rem}
.toast.show{display:block}
@media(max-width:600px){.grid{padding-left:10px;padding-right:10px;grid-template-columns:1fr}.player{flex-direction:column;align-items:stretch}}</style>
</head>

<div class="toolbar"><input id="S" type="search" placeholder="Buscar nombre, provincia, codec…"></div>
<main id="G" class="grid"></main>
<div id="P" class="player"><strong id="N"></strong><audio id="A" controls preload="none"></audio></div>
<div id="T" class="toast"></div>
<script>(function(){
var stations=JSON.parse(document.getElementById('D').textContent);
var filtered=stations.slice(),playing=null;
var grid=document.getElementById('G'),audio=document.getElementById('A'),player=document.getElementById('P'),nowEl=document.getElementById('N');
function imgErr(el){var fb=document.createElement('div');fb.className='logo-fb';fb.textContent='📻';el.parentNode.replaceChild(fb,el);}
function safeUrl(v){try{var u=new URL(v);return['http:','https:'].includes(u.protocol)?u.href:'';}catch(e){return '';}}
function toast(m,bad){var t=document.getElementById('T');t.textContent=m;t.style.borderColor=bad?'#a23f4a':'#34769d';t.classList.add('show');setTimeout(function(){t.classList.remove('show');},2500);}
function createCard(s){
  var stream=safeUrl(s.url_resolved||s.url);
  var art=document.createElement('article');art.className='card';art.dataset.id=s.stationuuid||'';
  var inner=document.createElement('div');inner.className='card-inner';
  var logo=safeUrl(s.favicon);
  if(logo){var img=document.createElement('img');img.className='logo';img.loading='lazy';img.src=logo;img.alt='';img.addEventListener('error',function(){imgErr(this);});inner.appendChild(img);}
  else{var fb=document.createElement('div');fb.className='logo-fb';fb.textContent='📻';inner.appendChild(fb);}
  var info=document.createElement('div');info.className='info';
  var h2=document.createElement('h2');h2.textContent=s.name||'Sin nombre';h2.title=s.name||'';
  var locEl=document.createElement('div');locEl.className='loc';locEl.textContent=[s.state,s.countrycode].filter(Boolean).join(' · ')||'España';
  var bdgs=document.createElement('div');bdgs.className='badges';
  if(s.codec){var b1=document.createElement('span');b1.className='badge';b1.textContent=s.codec;bdgs.appendChild(b1);}
  if(s.bitrate){var b2=document.createElement('span');b2.className='badge';b2.textContent=s.bitrate+' kbps';bdgs.appendChild(b2);}
  info.appendChild(h2);info.appendChild(locEl);info.appendChild(bdgs);
  inner.appendChild(info);art.appendChild(inner);
  var acts=document.createElement('div');acts.className='actions';
  var btn=document.createElement('button');btn.className='play';btn.dataset.action='play';
  if(!stream)btn.disabled=true;btn.textContent='▶ Escuchar';
  acts.appendChild(btn);art.appendChild(acts);return art;
}
function apply(){
  var q=document.getElementById('S').value.trim().toLowerCase();
  filtered=q?stations.filter(function(s){return[s.name,s.state,s.language,s.tags,s.codec].join(' ').toLowerCase().includes(q);}):stations.slice();
  render();
}
function render(){
  while(grid.firstChild)grid.removeChild(grid.firstChild);
  if(!filtered.length){var m=document.createElement('div');m.className='message';m.textContent='No hay emisoras que coincidan.';grid.appendChild(m);return;}
  filtered.forEach(function(s){grid.appendChild(createCard(s));});
}
grid.addEventListener('click',function(e){
  var btn=e.target.closest('[data-action="play"]');if(!btn)return;
  var s=stations.find(function(x){return x.stationuuid===btn.closest('.card').dataset.id;});if(!s)return;
  var stream=safeUrl(s.url_resolved||s.url);
  if(playing===s.stationuuid){audio.pause();audio.removeAttribute('src');playing=null;player.classList.remove('show');btn.classList.remove('stop');btn.textContent='▶ Escuchar';}
  else{
    if(playing){var old=grid.querySelector('[data-id="'+playing+'"] button[data-action="play"]');if(old){old.classList.remove('stop');old.textContent='▶ Escuchar';}}
    playing=s.stationuuid;audio.src=stream;nowEl.textContent=s.name||'Emisora';player.classList.add('show');
    audio.play().catch(function(){toast('No se puede reproducir.',true);});
    btn.classList.add('stop');btn.textContent='⏹ Detener';
  }
});
document.getElementById('S').addEventListener('input',apply);
apply();
})();</script>
