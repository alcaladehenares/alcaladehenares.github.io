function renderCards(data) {
  const container = document.getElementById('fuelCards');
  container.innerHTML = '';

  data.forEach(function(fuel, idx) {
    let rowsHtml = '';
    fuel.estaciones.forEach(function(est) {
      let priceClass = 'price-mid';
      if (est.esMejor) priceClass = 'price-best';
      else if (est.posicion === fuel.estaciones.length) priceClass = 'price-high';

      const badge = est.esMejor ? '<span class="badge-best">⭐ Mejor precio</span>' : '';

      rowsHtml += '<tr class="station-row">';
      rowsHtml += '<td class="rank">' + est.posicion + '</td>';
      rowsHtml += '<td class="station-name"><strong>' + est.gasolinera + '</strong>' + badge;
      rowsHtml += '<span class="station-addr">' + est.direccion + '</span></td>';
      rowsHtml += '<td class="price"><span class="price-val ' + priceClass + '">' + est.precio + ' €</span></td>';
      var diffClass = est.esMejor ? 'diff-zero' : (est.posicion <= Math.ceil(fuel.estaciones.length / 2) ? 'diff-low' : 'diff-high');
      rowsHtml += '<td class="diff"><span class="diff-val ' + diffClass + '">' + est.diferencia + '</span></td>';
      rowsHtml += '</tr>';
    });

    let cardHtml = '<div class="fuel-card" style="animation-delay:' + (idx * 0.1) + 's">';
    cardHtml += '<div class="fuel-header"><div class="fuel-name">' + fuel.nombre + '</div>';
    cardHtml += '<div class="fuel-stats"><span class="stat">' + fuel.total + ' estaciones</span>';
    cardHtml += '<span class="stat-range">' + fuel.precioMin + ' € — ' + fuel.precioMax + ' €</span></div></div>';
    cardHtml += '<table class="stations-table">';
    cardHtml += '<thead><tr><th>#</th><th>Gasolinera</th><th>Precio</th><th>Diferencia</th></tr></thead>';
    cardHtml += '<tbody>' + rowsHtml + '</tbody></table></div>';

    container.innerHTML += cardHtml;
  });
}

function filterCards() {
  const query = document.getElementById('searchInput').value.toLowerCase();
  if (!query) {
    renderCards(combustiblesData);
    document.getElementById('noResults').style.display = 'none';
    return;
  }

  const filtered = combustiblesData.map(function(fuel) {
    if (fuel.nombre.toLowerCase().includes(query)) return fuel;
    const estFilt = fuel.estaciones.filter(function(e) {
      return e.gasolinera.toLowerCase().includes(query) ||
             e.direccion.toLowerCase().includes(query) ||
             e.localidad.toLowerCase().includes(query);
    });
    if (estFilt.length > 0) {
      return Object.assign({}, fuel, { estaciones: estFilt, total: estFilt.length });
    }
    return null;
  }).filter(Boolean);

  renderCards(filtered);
  document.getElementById('noResults').style.display = filtered.length === 0 ? 'block' : 'none';
}

renderCards(combustiblesData);
</script>
